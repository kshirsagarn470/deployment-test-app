<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deployment Test App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="icon">🚀</div>

      <h1>Deployment Successful!</h1>

      <p>
        This website is running from my GitHub repository.
      </p>

      <div class="status">
        ✓ Git Clone Successful
        <br>
        ✓ Docker Build Successful
        <br>
        ✓ Docker Deployment Successful
      </div>

      <button onclick="showMessage()">
        Test Application
      </button>

      <p id="message"></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
